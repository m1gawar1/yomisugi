<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ヨミスギ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&family=M+PLUS+1+Code:wght@500&display=swap">
<style>

/* Layout: #（空）＝トーク一覧風のステージ選択、#<id>＝全画面のトーク画面。結果と図鑑は下から出る <dialog> */
:root{
  --bg:#eef0f3; --sheet:#ffffff; --fg:#1d2230; --muted:#6b7282; --line:#c4c8d0;
  --talk:#8aa6cf; --head:#2b3445; --headfg:#ffffff;
  --mine:#8de055; --minefg:#13200a; --theirs:#ffffff; --theirsfg:#1d2230; --time:#eef3fb;
  --kb:#d3d6dc; --key:#ffffff; --keyfg:#1d2230;
  --mark:#ffe14d; --accent:#2c5bd9; --good:#1f9d55; --bad:#d6453d; --warn:#c77700;
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --ui:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"M PLUS 1 Code",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13161d; --sheet:#1d212b; --fg:#eef0f5; --muted:#9aa1b2; --line:#3c4252;
  --talk:#1e2533; --head:#151a24; --headfg:#eef0f5;
  --mine:#5fb63a; --minefg:#0c1606; --theirs:#323a4a; --theirsfg:#eef0f5; --time:#8f99ad;
  --kb:#2a2f3b; --key:#454c5e; --keyfg:#eef0f5;
  --mark:#c9a600; --accent:#7ea2ff; --good:#4cc47f; --bad:#ff7a70; --warn:#f0a83a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13161d; --sheet:#1d212b; --fg:#eef0f5; --muted:#9aa1b2; --line:#3c4252;
  --talk:#1e2533; --head:#151a24; --headfg:#eef0f5;
  --mine:#5fb63a; --minefg:#0c1606; --theirs:#323a4a; --theirsfg:#eef0f5; --time:#8f99ad;
  --kb:#2a2f3b; --key:#454c5e; --keyfg:#eef0f5;
  --mark:#c9a600; --accent:#7ea2ff; --good:#4cc47f; --bad:#ff7a70; --warn:#f0a83a; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
/* トーク画面のときだけ body の余白をなくす */
body.talking{padding:0}
.wrap{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:400;font-size:2rem;margin:0;letter-spacing:.02em}
h1 span{background:linear-gradient(transparent 62%,var(--mark) 62%);color:var(--fg)}
.tag{font-size:.8rem;color:var(--muted)}
.mission{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.mission b{font-size:1.05rem;line-height:1.5}
.mission .lbl{font-size:.72rem;color:var(--muted);letter-spacing:.08em}
.copy{font-family:var(--display);font-size:1rem;line-height:1.5}

/* トーク一覧（ステージ選択） */
.rooms{display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--line);border-radius:16px;overflow:hidden;font-family:var(--ui)}
.room{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:72px;color:var(--fg);text-decoration:none;-webkit-tap-highlight-color:transparent}
.room+.room{border-top:1px solid var(--line)}
.room:hover{background:color-mix(in srgb,var(--fg) 5%,var(--sheet))}
.room:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.rav{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff}
.rb{flex:1;min-width:0;display:flex;flex-direction:column}
.rn,.rl{line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rn{font-weight:700}
.rl{font-size:.85rem;color:var(--muted)}
.rm{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.rt{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.rc{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.8rem}
.rc .ok{color:var(--good);font-weight:700}
.badge{background:var(--bad);color:var(--sheet);border-radius:10px;padding:1px 8px;font:700 .68rem var(--ui);line-height:1.5}

/* トーク画面（全画面）。PC では幅420px・高さ min(100dvh,860px) で中央に置く */
#game{display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100dvh}
.phone{width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;font-family:var(--ui);background:var(--talk)}
@media (min-width:480px){.phone{width:420px;height:min(100vh,860px);height:min(100dvh,860px);border-radius:26px;border:1px solid var(--line)}}
.top{flex:none;background:var(--head);color:var(--headfg);display:flex;align-items:center;gap:8px;padding:calc(4px + env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) 4px max(4px,env(safe-area-inset-left,0px))}
.top .back{flex:none;width:44px;height:44px;display:grid;place-items:center;font:400 2rem/1 var(--ui);color:inherit;background:none;border:0;border-radius:50%;cursor:pointer;padding:0 0 4px}
.top .name{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .icons{flex:none;display:flex;gap:14px;opacity:.85}
.top svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.zbtn{flex:none;min-height:44px;padding:0 12px;border:0;border-radius:22px;background:color-mix(in srgb,var(--headfg) 14%,transparent);color:inherit;font:700 .8rem var(--ui);white-space:nowrap;cursor:pointer}
.zbtn b{font-family:var(--mono);font-weight:500}
.talk{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px max(12px,env(safe-area-inset-right,0px)) 16px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.talk>:first-child{margin-top:auto}
.day{align-self:center;font-size:.7rem;color:var(--headfg);background:color-mix(in srgb,var(--head) 45%,transparent);padding:3px 10px;border-radius:10px}
.msg{display:flex;gap:6px;align-items:flex-end;max-width:100%}
.msg.mine{flex-direction:row-reverse}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;color:#fff;align-self:flex-start}
.who{font-size:.7rem;color:var(--time);margin:0 0 3px 2px}
.bub{padding:8px 12px;border-radius:18px;font-size:.95rem;line-height:1.5;word-break:break-all;min-width:0;max-width:250px}
.theirs .bub{background:var(--theirs);color:var(--theirsfg);border-top-left-radius:4px}
.mine .bub{background:var(--mine);color:var(--minefg);border-top-right-radius:4px}
.meta{font-size:.62rem;color:var(--time);white-space:nowrap;line-height:1.3;text-align:right}
.theirs .meta{text-align:left}
.sent{animation:send .35s ease-out}
@keyframes send{from{transform:translateY(14px);opacity:0}}
.inbar{flex:none;background:var(--sheet);display:flex;align-items:center;gap:10px;padding:6px max(8px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.inbar svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:1.8;flex:none}
.input{flex:1;min-width:0;background:var(--bg);border-radius:18px;padding:8px 12px;font-size:1rem;line-height:1.5;min-height:1.5em;word-break:break-all;color:var(--fg)}
.sendb{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--sheet);font-size:1.15rem;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0 0 0 3px}
.sendb:disabled{background:var(--line);color:var(--muted);cursor:default}
.retry{flex:none;min-height:44px;padding:0 16px;border:0;border-radius:22px;background:var(--fg);color:var(--bg);font:700 .9rem var(--body);cursor:pointer}
.kana{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;background:color-mix(in srgb,var(--accent) 14%,transparent)}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--accent);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ph{color:var(--muted)}
.bar{flex:none;background:var(--kb);padding:8px max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:6px;min-height:60px}
.bar::-webkit-scrollbar{display:none}
.cand{flex:none;font:inherit;background:var(--key);color:var(--keyfg);border:0;border-radius:7px;padding:8px 12px;min-height:44px;font-size:1rem;box-shadow:0 1px 0 rgba(0,0,0,.18);white-space:nowrap}
button.cand{cursor:pointer}
button.cand:active{transform:translateY(1px)}
.cand.learn{background:color-mix(in srgb,var(--accent) 16%,var(--key));box-shadow:inset 0 0 0 2px var(--accent),0 1px 0 rgba(0,0,0,.18)}
.cand .lt{display:inline-block;margin-left:6px;padding:0 5px;border-radius:5px;background:var(--accent);color:var(--sheet);font:700 .62rem/1.6 var(--ui);vertical-align:2px}
.pop{animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:.3}}
.keys{flex:none;position:relative;background:var(--kb);display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 max(8px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.keys span{background:var(--key);color:var(--keyfg);border-radius:7px;text-align:center;min-height:44px;display:grid;place-items:center;font-size:.95rem;box-shadow:0 1px 0 rgba(0,0,0,.18);opacity:.75}
.keys span.fn{font-size:.75rem;display:grid;place-items:center}
.keys.broken span{opacity:.3}
/* 壊れたキーボードの中で ⌫ だけ生きている */
.keys .bs{position:relative;z-index:1;min-height:44px;border:0;border-radius:7px;background:var(--accent);color:var(--sheet);font:700 1.05rem var(--ui);box-shadow:0 1px 0 rgba(0,0,0,.18);cursor:pointer}
.keys .bs:active{transform:translateY(1px)}
.keys .bs:disabled{opacity:.35;cursor:default}
.broken-tag{position:absolute;inset:0 8px 10px;display:grid;place-items:center;font:700 .9rem var(--body);color:var(--bad);letter-spacing:.1em;pointer-events:none}
.broken-tag i{font-style:normal;background:var(--sheet);border:2px solid var(--bad);border-radius:8px;padding:4px 12px;transform:rotate(-4deg)}

.ctrl{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.more,.undo{font:700 1rem var(--body);border:2px dashed var(--line);background:transparent;color:var(--fg);border-radius:14px;padding:12px;cursor:pointer}
.more:disabled,.undo:disabled,.send:disabled{opacity:.4;cursor:default}
.send,.next{font:700 1rem var(--body);background:var(--fg);color:var(--bg);border:0;border-radius:14px;padding:12px 18px;cursor:pointer}
.stat{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.stat b{font-family:var(--mono);color:var(--fg)}
.q{font-size:.85rem;color:var(--muted);margin:2px 0 -4px;display:flex;justify-content:space-between;gap:8px}
.choices{display:grid;gap:8px}
.ch{font:500 1rem var(--body);text-align:left;background:var(--sheet);color:var(--fg);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;line-height:1.4}
.ch:hover:not(:disabled){border-color:var(--fg)}
.ch:disabled{cursor:default}
.ch.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--sheet))}
.ch.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--sheet))}
.ch.dim{opacity:.45}
.miss{color:var(--bad);font-weight:700}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.result{display:flex;flex-direction:column;gap:10px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px}
.result .head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.verdict{font-family:var(--display);font-size:1.5rem}
.verdict.ok{color:var(--good)} .verdict.ng{color:var(--bad)} .verdict.leak{color:var(--warn)}
.result p{margin:0;font-size:.9rem;line-height:1.6}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.count{font-family:var(--mono);font-size:.9rem}
.count b{font-size:1.3rem}
.lead{font-size:.85rem;color:var(--muted);line-height:1.7;margin:0}

/* 下から出るシート（結果モーダル・図鑑） */
dialog.sheet{position:fixed;inset:0;margin:auto auto 0;width:min(420px,100%);max-width:100%;max-height:88vh;max-height:88dvh;padding:0;border:0;border-radius:20px 20px 0 0;background:var(--sheet);color:var(--fg);overflow-y:auto;overscroll-behavior:contain;box-shadow:0 -6px 24px rgba(0,0,0,.2)}
dialog.sheet[open]{animation:up .28s ease-out}
dialog.sheet::backdrop{background:rgba(10,12,18,.55)}
dialog.sheet[open]::backdrop{animation:fade .28s ease-out}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.sh{display:flex;flex-direction:column;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.grip{align-self:center;width:44px;height:5px;border-radius:3px;background:var(--line);margin:2px 0 4px}
.res .no{font-family:var(--mono);font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;margin-top:6px}
.res .new{color:var(--bg);background:var(--bad);border-radius:6px;padding:1px 8px;font-family:var(--body);font-weight:700}
.res .title{font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1.3;margin:0}
.res .title.good{color:var(--good)}
.res p{margin:0;font-size:.9rem;color:var(--muted);line-height:1.7}
.res .learned{color:var(--accent);font-weight:700}
.res .all{color:var(--good);font-weight:700}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.acts button{min-height:48px;font:700 .95rem var(--body);border-radius:14px;padding:8px 10px;cursor:pointer;border:2px solid var(--line);background:transparent;color:var(--fg)}
.acts .pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.zh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.zh h2{font-size:1rem;margin:0;line-height:1.4}
.zh h2 b{font-family:var(--mono);font-weight:500;margin-left:6px}
.x{flex:none;width:44px;height:44px;margin-right:-8px;border:0;border-radius:50%;background:none;color:var(--muted);font-size:1.2rem;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:62px;min-width:0;display:flex;flex-direction:column;gap:2px}
.slot .n{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.slot .t{font-size:.82rem;font-weight:700;line-height:1.3}
.slot.lock{background:transparent;border-style:dashed}
.slot .lm{margin-left:4px;padding:0 4px;border-radius:4px;border:1px solid var(--accent);color:var(--accent);font:700 .6rem/1.5 var(--ui)}
.slot.lock .t{color:var(--muted);letter-spacing:.2em}
.slot.just{border-color:var(--bad);box-shadow:0 0 0 2px color-mix(in srgb,var(--bad) 30%,transparent)}
button.slot{font:inherit;color:var(--fg);text-align:left;cursor:pointer}
.slot.sel{border:2px solid var(--fg)}
.hint{margin-top:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:.9rem;line-height:1.5;min-height:2.6em}
.hint .lbl{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted)}
.lrow b{font-family:var(--mono);color:var(--fg)}
.lrow .reset{align-self:auto}
.lrow .reset:disabled{opacity:.4;cursor:default;text-decoration:none}
.reset{align-self:flex-end;min-height:44px;font:500 .75rem var(--body);background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0 4px}
@media (prefers-reduced-motion:reduce){.caret,.pop,.sent,.shake,dialog.sheet[open],dialog.sheet[open]::backdrop{animation:none}}
</style>

<div class="wrap" id="list">
  <header>
    <h1><span>ヨミスギ</span></h1>
    <div class="count" id="count"></div>
  </header>
  <p class="lead">キーボードが壊れて、予測変換しか押せない。しかもこのスマホは予測しすぎる。返信して、全部のエンディングを見つけよう。</p>
  <nav class="rooms" id="rooms" aria-label="返信する相手を選ぶ"></nav>
  <div class="lrow"><span id="lstat"></span><button class="reset" id="lreset">学習をリセット</button></div>
</div>
<main id="game" hidden></main>

<dialog class="sheet" id="res" aria-labelledby="restitle"><div class="sh res" id="resbody"></div></dialog>
<dialog class="sheet" id="zk" aria-labelledby="ztitle">
  <div class="sh">
    <div class="grip" aria-hidden="true"></div>
    <div class="zh"><h2 id="ztitle">エンディング図鑑<b id="zcount"></b></h2><button class="x" id="zclose" aria-label="図鑑を閉じる">✕</button></div>
    <span class="tag" id="zwho"></span>
    <div class="grid" id="grid"></div>
    <div class="hint" id="hint" aria-live="polite"></div>
    <button class="reset" id="reset">この相手の記録を消す</button>
  </div>
</dialog>

<script>
const ICON={
 search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>',
 call:'<svg viewBox="0 0 24 24"><path d="M6 3h3l2 5-2.5 1.5a11 11 0 005 5L15 12l5 2v3a3 3 0 01-3 3A15 15 0 013 6a3 3 0 013-3z"/></svg>',
 menu:'<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
 plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
 cam:'<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M9 7l1.5-2.5h3L15 7"/></svg>',
 img:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>'
};
const KEYS=["☆123","あ","か","さ","⌫","ABC","た","な","は","空白","あいう","ま","や","ら","改行"];
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const $=id=>document.getElementById(id);

// ステージの中身は data/stages/*.json にある。順番は data/stages.json の order。
let STAGES=[],WORDS=[];
async function loadStages(){
  const {order,words}=await (await fetch("data/stages.json")).json();
  WORDS=words||[];
  STAGES=await Promise.all(order.map(async id=>{
    const d=await (await fetch(`data/stages/${id}.json`)).json();
    return {...d,E:d.endings.map(e=>[e.title,e.reply,e.comment,e.hint,e.good,e.hidden]),N:d.nodes};
  }));
}

let st=0,path=["s"],done=null,isNew=false,sel=null,found=[],learned=new Set(),newWords=[]; // learned＝スマホが覚えた言葉、newWords＝今回の送信で新しく覚えた言葉
let cur=null,timer=0,pend=false; // cur＝表示中の画面（""＝一覧、id＝トーク）。timer/pend＝送信後に結果モーダルを出す待ち
const keyOf=i=>"yomisugi-endings-"+STAGES[i].id;
const initFound=()=>STAGES.forEach((S,i)=>{let f=[];try{f=JSON.parse(localStorage.getItem(keyOf(i))||"[]")}catch(e){}found[i]=new Set(f)});
const save=()=>{try{localStorage.setItem(keyOf(st),JSON.stringify([...found[st]]))}catch(e){}};
const LKEY="yomisugi-learned";
const initLearned=()=>{let l=[];try{l=JSON.parse(localStorage.getItem(LKEY)||"[]")}catch(e){}learned=new Set(Array.isArray(l)?l.filter(w=>WORDS.includes(w)):[])};
const saveLearned=()=>{try{localStorage.setItem(LKEY,JSON.stringify([...learned]))}catch(e){}};
const candsOf=n=>(n.c||[]).filter(c=>!c[2]||learned.has(c[2])); // 学習候補は覚えている言葉のものだけ出す
const game=$("game"),list=$("list"),res=$("res"),zk=$("zk");

function bubble(m){
  if(m.mine) return `<div class="msg mine ${m.cls||""}"><div class="bub">${esc(m.t)}</div><div class="meta">${m.read?"既読<br>":""}${m.at}</div></div>`;
  return `<div class="msg theirs ${m.cls||""}"><div class="av" style="background:${m.c}">${esc(m.who[0])}</div>
    <div style="min-width:0"><div class="who">${esc(m.who)}</div><div style="display:flex;gap:6px;align-items:flex-end"><div class="bub">${esc(m.t)}</div><div class="meta">${m.at}</div></div></div></div>`;
}
const no=i=>"END "+String(i+1).padStart(2,"0");

// ダイアログ：showModal で開き、閉じたら開く前の要素（なければ back()）へフォーカスを戻す
function openDlg(d,back){
  const a=document.activeElement;d._ret=a&&a!==document.body?a:null;d._back=back;d.showModal();
}
[res,zk].forEach(d=>{
  d.addEventListener("click",e=>{if(e.target===d)d.close()}); // 背景（::backdrop）のタップで閉じる
  d.addEventListener("close",()=>{const t=d._ret;d._ret=null;if(t&&t.isConnected&&t.offsetParent)t.focus();else if(d._back)d._back()});
});
$("zclose").onclick=()=>zk.close();
const focusTalk=()=>{const t=$("retry")||game.querySelector(".cand");if(t&&!game.hidden)t.focus()};

// 一覧
function renderList(){
  const tot=STAGES.reduce((a,s,i)=>a+found[i].size,0),all=STAGES.reduce((a,s)=>a+s.E.length,0);
  $("count").innerHTML=`<b>${tot}</b> / ${all}`;
  $("lstat").innerHTML=`スマホの学習: <b>${learned.size}/${WORDS.length}</b>`;$("lreset").disabled=!learned.size;
  $("rooms").innerHTML=STAGES.map((S,i)=>{const n=found[i].size,m=S.E.length;
    return `<a class="room" href="#${encodeURIComponent(S.id)}" data-i="${i}"><span class="rav" style="background:${S.color}" aria-hidden="true">${esc(S.who[0])}</span>
      <span class="rb"><span class="rn">${esc(S.who)}</span><span class="rl">${esc(S.ask)}</span></span>
      <span class="rm"><span class="rt">${esc(S.askAt)}</span><span class="rc">${n===m?'<span class="ok" aria-label="全部見つけた">✓</span>':""}<span>${n}/${m}</span>${n?"":'<span class="badge">NEW</span>'}</span></span></a>`}).join("");
  // 一覧から入ったことを履歴に残す（‹ で history.back() できるように）
  $("rooms").querySelectorAll(".room").forEach(a=>a.onclick=e=>{
    if(e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
    e.preventDefault();history.pushState({list:1},"","#"+encodeURIComponent(STAGES[+a.dataset.i].id));route();
  });
}

// 図鑑（シートの中身）
function drawGallery(){
  const S=STAGES[st],F=found[st];
  $("zcount").textContent=`${F.size}/${S.E.length}`;
  $("zwho").textContent=S.who;
  $("grid").innerHTML=S.E.map((e,i)=>{
    const got=F.has(i),just=done!=null&&S.N[path.at(-1)].e===i;
    return `<button class="slot ${got?"":"lock"} ${just?"just":""} ${sel===i?"sel":""}" data-i="${i}"><span class="n">${no(i)}${e[5]&&!got?'<span class="lm">学習</span>':""}</span><span class="t">${got?esc(e[0]):"？？？"}</span></button>`}).join("");
  const h=$("hint");
  if(sel==null)h.innerHTML='<span class="tag">枠をタップすると、ヒントや相手の返信が見られます</span>';
  else if(F.has(sel))h.innerHTML=`<span class="lbl">${no(sel)}　${esc(S.E[sel][0])}</span><span>${esc(S.who)}「${esc(S.E[sel][1])}」</span>`;
  else h.innerHTML=`<span class="lbl">${no(sel)}　ヒント${S.E[sel][5]?"（スマホの学習が必要）":""}</span><span>${esc(S.E[sel][3])}</span>`;
  document.querySelectorAll("#grid .slot").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;sel=sel===i?null:i;drawGallery();const n=$("grid").querySelector(`[data-i="${i}"]`);if(n)n.focus()});
}
function openZukan(back){clearArm();drawGallery();openDlg(zk,back||focusTalk)}
zk.addEventListener("close",()=>{if(pend){pend=false;if(cur&&done!=null)showResult()}}); // 待ち中に図鑑を開いていたら、閉じたあとに結果を出す

// トーク画面
function renderTalk(pop){
  const S=STAGES[st],node=S.N[path.at(-1)],P={who:S.who,c:S.color};
  let log=bubble({...P,t:S.ask,at:S.askAt});
  if(done!=null){
    log+=bubble({mine:true,t:node.t,at:S.sentAt,read:true,cls:"sent"});
    log+=bubble({...P,t:S.E[node.e][1],at:S.sentAt,cls:"sent"});
  }
  const input=done!=null?'<span class="ph">メッセージを入力</span>':esc(node.t)+'<span class="caret"></span>';
  const btn=done!=null?'<button class="retry" id="retry">もう一度</button>':`<button class="sendb" id="send" aria-label="この文で送信" ${node.t?"":"disabled"}>➤</button>`;
  const cands=candsOf(node); // onclick もこのフィルタ後の配列で組む（i がずれないように）
  const bar=done!=null?"":cands.map((c,i)=>`<button class="cand ${c[2]?"learn":""} ${pop?"pop":""}" data-i="${i}">${esc(c[0])}${c[2]?'<span class="lt">学習</span>':""}</button>`).join("")||'<span class="tag" style="padding:8px">これ以上の候補はありません</span>';
  const keys=KEYS.map(k=>k==="⌫"?`<button class="bs" id="bs" aria-label="1つ戻す" ${done==null&&path.length>1?"":"disabled"}>⌫</button>`:`<span class="${k.length>1?"fn":""}" aria-hidden="true">${k}</span>`).join("");
  game.innerHTML=`<div class="phone">
    <div class="top"><button class="back" id="back" aria-label="トーク一覧に戻る">‹</button><span class="name">${esc(S.who)}</span><span class="icons" aria-hidden="true">${ICON.search}${ICON.call}</span><button class="zbtn" id="zbtn">図鑑 <b>${found[st].size}/${S.E.length}</b></button></div>
    <div class="talk" id="talk"><span class="day">今日</span>${log}</div>
    <div class="inbar"><span aria-hidden="true" style="display:contents">${ICON.plus}${ICON.cam}${ICON.img}</span><div class="input" aria-label="入力中の文字">${input}</div>${btn}</div>
    <div class="bar" aria-label="予測変換の候補">${bar}</div>
    <div class="keys broken">${keys}<div class="broken-tag" aria-hidden="true"><i>キーボード故障中</i></div></div>
  </div>`;
  const t=$("talk");t.scrollTop=t.scrollHeight;
  game.querySelectorAll(".bar .cand").forEach(b=>b.onclick=()=>{path.push(cands[+b.dataset.i][1]);renderTalk(true)});
  $("back").onclick=goList;
  $("zbtn").onclick=()=>{if(timer){clearTimeout(timer);timer=0;pend=true}openZukan()};
  const u=$("bs");if(u)u.onclick=()=>{path.pop();renderTalk(true);const b=$("bs");if(b&&!b.disabled)b.focus()};
  const s=$("send");if(s)s.onclick=()=>{done=node.e;isNew=!found[st].has(node.e);found[st].add(node.e);save();
    newWords=WORDS.filter(w=>!learned.has(w)&&node.t.includes(w));if(newWords.length){newWords.forEach(w=>learned.add(w));saveLearned()}renderTalk(false);
    clearTimeout(timer);timer=setTimeout(()=>{timer=0;showResult()},800)};
  const r=$("retry");if(r)r.onclick=retry;
}
function retry(){clearTimeout(timer);timer=0;pend=false;path=["s"];done=null;sel=null;renderTalk(true);if(res.open)res.close();focusTalk()}
function goList(){
  clearTimeout(timer);timer=0;pend=false; // popstate は後から届くので、ここで先に止めておく
  if(history.state&&history.state.list)history.back();
  else{history.replaceState(null,"",location.pathname+location.search);route()}
}

// 結果モーダル
function showResult(){
  const S=STAGES[st],node=S.N[path.at(-1)],e=S.E[node.e],complete=found[st].size===S.E.length;
  $("resbody").innerHTML=`<div class="grip" aria-hidden="true"></div>
    <div class="no"><span>${no(node.e)}</span>${isNew?'<span class="new">NEW</span>':'<span>発見済み</span>'}</div>
    <h2 class="title ${e[4]?"good":""}" id="restitle">${esc(e[0])}</h2><p>${esc(e[2])}</p>
    ${newWords.length?`<p class="learned">📱 スマホが${newWords.map(w=>"「"+esc(w)+"」").join("")}を覚えた</p>`:""}
    ${complete?'<p class="all">この相手は全エンディング達成！</p>':""}
    <div class="acts"><button id="share">シェア</button><button class="pri" id="again">もう一度</button>
    <button id="tozk">図鑑を見る</button><button id="tolist">相手を選ぶ</button></div>`;
  $("again").onclick=retry;
  $("tozk").onclick=()=>{res.close();openZukan()};
  $("tolist").onclick=()=>{res._ret=null;res._back=null;res.close();goList()};
  // シェア：共有シートが使えれば共有、だめ/未対応ならクリップボードにコピー
  const sh=$("share");sh.onclick=async()=>{const text=`ヨミスギ｜${S.who}に返信したら ${no(node.e)}「${e[0]}」（${found[st].size}/${S.E.length}）`,url=location.origin+location.pathname+"#"+S.id,flash=m=>{sh.textContent=m;setTimeout(()=>{sh.textContent="シェア"},2000)};
    try{if(navigator.share){await navigator.share({text,url});return}}catch(err){if(err&&err.name==="AbortError")return}
    try{await navigator.clipboard.writeText(text+" "+url);flash("コピーしました")}catch(err){flash("コピーできませんでした")}};
  if(zk.open)return void(pend=true);
  openDlg(res,focusTalk);$("again").focus();
}

// 画面の振り分け：#（空）＝一覧、#<id>＝トーク。知らない id は一覧に戻す
function route(){
  let id="";try{id=decodeURIComponent(location.hash.slice(1))}catch(e){}
  const i=STAGES.findIndex(S=>S.id===id);
  if(id&&i<0){history.replaceState(null,"",location.pathname+location.search);id=""}
  if(id===cur)return;
  const prev=cur;cur=id;
  clearTimeout(timer);timer=0;pend=false;
  [res,zk].forEach(d=>{if(d.open){d._ret=null;d._back=null;d.close()}});
  document.body.classList.toggle("talking",!!id);
  list.hidden=!!id;game.hidden=!id;
  if(id){st=i;path=["s"];done=null;sel=null;clearArm();renderTalk(false);scrollTo(0,0)}
  else{renderList();if(prev){const a=$("rooms").querySelector(`[data-i="${st}"]`);if(a)a.focus({preventScroll:true})}}
}
addEventListener("hashchange",route);
addEventListener("popstate",route);

let armed=false,armT=0;
const resetBtn=$("reset");
function clearArm(){armed=false;clearTimeout(armT);resetBtn.textContent="この相手の記録を消す"}
resetBtn.onclick=()=>{
  if(!armed){armed=true;resetBtn.textContent="本当に消す？もう一度押す";armT=setTimeout(clearArm,3000);return}
  clearArm();clearTimeout(timer);timer=0;pend=false;found[st]=new Set();save();path=["s"];done=null;sel=null;
  renderTalk(false);drawGallery();renderList(); // 一覧の達成数とヘッダーの「図鑑 n/m」も更新する
};
// 学習のリセット（記録リセットと同じ2回押し方式）
let lArmed=false,lArmT=0;
const lreset=$("lreset");
function clearLArm(){lArmed=false;clearTimeout(lArmT);lreset.textContent="学習をリセット"}
lreset.onclick=()=>{
  if(!learned.size)return;
  if(!lArmed){lArmed=true;lreset.textContent="本当に消す？もう一度押す";lArmT=setTimeout(clearLArm,3000);return}
  clearLArm();learned=new Set();saveLearned();renderList();
};
loadStages().then(()=>{initFound();initLearned();route()}).catch(err=>{
  $("rooms").innerHTML=`<div class="result"><p>ステージのデータを読み込めませんでした。ファイルを直接開いている場合は、README の「手元で動かす」の手順でローカルサーバーから開いてください。</p><p class="tag">${esc(String(err))}</p></div>`;
});
</script>
